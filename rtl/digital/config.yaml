# Synthesis, placement and clock-tree synthesis for the digital back end.
# The clock is the faster reference, 36 MHz (27.778 ns). 32 MHz is a longer period.
DESIGN_NAME: digital_backend
VERILOG_FILES:
  - dir::spi_regs.sv
  - dir::rate_table.sv
  - dir::bit_front.sv
  - dir::cic4.sv
  - dir::hb_sram.sv
  - dir::fir_seq.sv
  - dir::decim_chain.sv
  - dir::dc_offset.sv
  - dir::iq_cal.sv
  - dir::power_ctrl.sv
  - dir::i2s_master.sv
  - dir::sample_fifo.sv
  - dir::i2s_slave.sv
  - dir::clk_gate.sv
  - dir::tx_chain.sv
  - dir::digital_backend.sv
CLOCK_PORT: clk
CLOCK_PERIOD: 27.778
FALLBACK_SDC: dir::constraints.sdc
FP_CORE_UTIL: 55
PL_TARGET_DENSITY: 0.6
pdk::ihp-sg13g2:
  STD_CELL_LIBRARY: sg13g2_stdcell
  CLOCK_PERIOD: 27.778

MACROS:
  RM_IHPSG13_1P_64x16_c2:
    gds:
      - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/gds/RM_IHPSG13_1P_64x16_c2.gds
    lef:
      - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lef/RM_IHPSG13_1P_64x16_c2.lef
    lib:
      "*typ*":
        - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lib/RM_IHPSG13_1P_64x16_c2_typ_1p20V_25C.lib
      "*slow*":
        - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lib/RM_IHPSG13_1P_64x16_c2_slow_1p08V_125C.lib
      "*fast*":
        - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lib/RM_IHPSG13_1P_64x16_c2_fast_1p32V_m55C.lib
    instances:
      u_fir.u_ram.u_ram:
        location: [100, 100]
        orientation: N

PDN_MACRO_CONNECTIONS:
  - "u_fir.u_ram.u_ram VPWR VGND VDD! VSS!"
  - "u_fir.u_ram.u_ram VPWR VGND VDDARRAY! VSS!"
PDN_CFG: dir::pdn_cfg.tcl
FP_MACRO_VERTICAL_HALO: 13.78
